name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
      # .env is gitignored (real secrets); pubspec.yaml bundles it as an
      # asset, so CI needs a stand-in for flutter analyze's asset check
      # and flutter_dotenv to have something to load.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
